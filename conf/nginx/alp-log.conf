# /etc/nginx/conf.d/alp-log.conf

# alp で解析できるよう JSON 形式のアクセスログを出力する
# 注意: nginx.conf の http コンテキストにある既存の access_log (combined) は
# 無効化できないため、別ファイルに出し分ける（access_log は複数書くと併記される）
log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","protocol":"$server_protocol","status":$status,"body_bytes":$body_bytes_sent,"request_time":$request_time}';
access_log /var/log/nginx/access.json.log json;
