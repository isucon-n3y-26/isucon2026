# Managed by provisioning/deploy.sh.
# asia2 (2 vCPU / 3.8GB) 向けの設定。平均 350KB の画像を DB に保存するので、WAL の書き込みが多い。

# shared_buffers と wal_buffers の反映には PostgreSQL の再起動が必要。
shared_buffers = 1GB
wal_buffers = 64MB

# 走行中のチェックポイントの頻発を抑える。ディスクには WAL 4GB 分の空きが要る。
max_wal_size = 4GB

# OS やサーバーのクラッシュで直前のコミットを失うことがあるが、DB は壊れない。通常の再起動では失わない。
synchronous_commit = off
